<div class="register-container">
  <div class="background-effects">
    <div class="glow glow-green"></div>
    <div class="glow glow-blue"></div>
    <div class="grid-background"></div>
  </div>

  <div class="register-card">
    <div class="top-line"></div>

    <section class="form-section">
      <div class="brand-header">
        <div class="brand-dots">
          <span class="dot-green"></span>
          <span class="dot-blue"></span>
          <span class="dot-gold"></span>
          <span class="dot-red"></span>
        </div>
        <h2>Spend<span>Wise</span></h2>
        <p>Creación de cuenta y alta en el sistema.</p>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        <div class="error-icon">!</div>
        <span>{{ errorMessage }}</span>
      </div>

      <div *ngIf="successMessage" class="success-message" style="color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px;">
        <span>{{ successMessage }}</span>
      </div>

      <form class="register-form" (ngSubmit)="onRegister()">
        <!-- Campo Username -->
        <div class="input-group">
          <label for="username">Nombre de usuario</label>
          <div class="input-wrapper">
            <input
              id="username"
              type="text"
              [(ngModel)]="credentials.username"
              name="username"
              placeholder="Su usuario"
              required
            />
          </div>
        </div>

        <!-- Campo Email -->
        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <input
              id="email"
              type="email"
              [(ngModel)]="credentials.email"
              name="email"
              placeholder="ejemplo@correo.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <!-- Campo Password -->
        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="credentials.password"
              name="password"
              placeholder="••••••••••••"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
            >
              <span *ngIf="!showPassword">👁️</span>
              <span *ngIf="showPassword">🙈</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-register" [disabled]="isLoading">
          <span *ngIf="!isLoading">Completar Registro</span>
          <span *ngIf="isLoading">Procesando...</span>
        </button>
      </form>

      <div class="login-redirect">
        <span>¿Ya dispone de una cuenta en el sistema?</span>
        <a routerLink="/login">Inicie sesión</a>
      </div>
    </section>

    <section class="welcome-section">
      <div class="welcome-content">
        <h1>Comience su gestión inteligente.</h1>
        <p>Regístrese hoy mismo para habilitar su panel de control financiero con total seguridad.</p>
      </div>
    </section>
  </div>
</div>
